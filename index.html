<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt UI Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🤖 Prompt UI Generator</h1>
            <p>Generate Beautiful HTML UI using Groq AI</p>
        </div>


        <div class="card">

            <h2>Enter Prompt</h2>

            <textarea
                id="prompt"
                placeholder="Example: Create a Hospital Dashboard"
                maxlength="500"></textarea>

            <div class="counter">
                <span id="count">0</span>/500 Characters
            </div>

            <div class="buttons">

                <button onclick="generateUI()">
                    🚀 Generate UI
                </button>

                <button onclick="clearPrompt()">
                    🗑 Clear
                </button>

                <button onclick="downloadHTML()">
                    ⬇ Download HTML
                </button>

                <button onclick="copyHTML()">
                    📋 Copy HTML
                </button>

            </div>

        </div>

        <div class="main">

            <div class="left">

                <div class="card">

                    <h2>Recent Prompts</h2>

                    <ul id="history">

                        <li>Create Login Page</li>
                        <li>Hospital Dashboard</li>
                        <li>Portfolio Website</li>

                    </ul>

                </div>

                <div class="card">

                    <h2>AI Status</h2>

                    <p>🟢 Connected</p>

                    <p><b>Model:</b> Llama 3.3 70B</p>

                    <p><b>Backend:</b> Groq API</p>

                </div>

            </div>

            <div class="right">

                <div class="card">

    <h2>Generated UI Preview</h2>

    <iframe
        id="preview"
        style="
            width:100%;
            height:800px;
            border:none;
            border-radius:10px;
            background:rgb(255, 255, 255);
        ">
    </iframe>

</div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
